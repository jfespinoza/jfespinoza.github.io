name: Publicar curso Álgebra 2026-2

on:
  push:
    branches: [main]
    paths:
      - "proyectos/curso-algebra-2026-2/**"
      - ".github/workflows/publicar-curso-algebra-2026-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-curso-algebra-2026-2
  cancel-in-progress: true

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Renderizar el libro
        run: quarto render proyectos/curso-algebra-2026-2

      - name: Verificar recursos matemáticos locales
        run: |
          test -f proyectos/curso-algebra-2026-2/_site/mathjax/tex-chtml-full.js
          if grep -RIlE 'cdnjs\.cloudflare\.com/polyfill|cdn\.jsdelivr\.net/npm/mathjax' \
            proyectos/curso-algebra-2026-2/_site --include='*.html'; then
            echo "Se detectó una dependencia matemática externa; se cancela la publicación."
            exit 1
          fi

      - name: Actualizar la carpeta pública
        run: |
          rm -rf curso-algebra-2026-2
          mkdir -p curso-algebra-2026-2
          cp -R proyectos/curso-algebra-2026-2/_site/. curso-algebra-2026-2/
          touch curso-algebra-2026-2/.nojekyll

      - name: Registrar la versión publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curso-algebra-2026-2
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Actualizar libro de Álgebra 2026-2 [skip ci]"
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA..origin/main" -- \
            proyectos/curso-algebra-2026-2 \
            .github/workflows/publicar-curso-algebra-2026-2.yml; then
            echo "Hay cambios fuente más recientes; la ejecución nueva realizará la publicación."
            exit 0
          fi
          git rebase origin/main
          git push
